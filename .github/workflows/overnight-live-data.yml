name: AI-QUANTUM Overnight Real-Data Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

concurrency:
  group: overnight-real-data-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      APP_ENV: live-data
      LIVE_TRADING: 'false'
      EMERGENCY_STOP: 'true'
      REAL_MARKET_DATA: 'true'
      PAPER_EXECUTION: 'true'
      NATIVE_QUOTES_REQUIRED: 'true'
      RECONCILIATION_REQUIRED: 'true'
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_DATASET_ID: ${{ vars.KAGGLE_DATASET_ID }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall src app.py
      - name: Core and gate tests
        run: pytest -q
      - name: Overnight real-data paper audit
        run: |
          mkdir -p reports/overnight
          AUDIT_OUT=reports/overnight/overnight_report.json python scripts/overnight_market_audit.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overnight-audit-${{ github.run_number }}
          path: reports/overnight/
          if-no-files-found: error
          retention-days: 14
