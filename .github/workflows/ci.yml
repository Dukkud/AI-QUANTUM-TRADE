name: AI-QUANTUM CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall src app.py
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Secret pattern scan
        run: |
          ! grep -RInE '(KAGGLE_API_TOKEN|api[_-]?key|secret|password|token)\s*[:=]\s*[^\s#]+' --exclude-dir=.git --exclude='*.lock' . | grep -vE '(KAGGLE_API_TOKEN=|token: \$\{\{|secret|password)' || true
