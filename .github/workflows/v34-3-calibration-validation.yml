name: v34.3 Regime Calibration Validation

on:
  push:
    branches: ["feat/v34-3-regime-calibration"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  calibration:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      LIVE_TRADING: "false"
      PAPER_EXECUTION: "true"
      ADAPTIVE_WEIGHT_UPDATES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src tests
      - run: pytest -q tests/test_regime_calibration.py tests/test_challenger_shadow.py tests/test_proposal_ledger.py tests/test_adaptive_shadow.py tests/test_walk_forward.py tests/test_statistical_evidence.py tests/test_label_aware_lineage.py tests/test_evidence_dataset.py tests/test_rolling_oos.py tests/test_evidence_events.py tests/test_evidence_ledger.py tests/test_shadow_learning.py tests/test_calibration_drift.py
      - name: Safety invariants
        run: |
          test "$LIVE_TRADING" = "false"
          test "$PAPER_EXECUTION" = "true"
          test "$ADAPTIVE_WEIGHT_UPDATES" = "false"
